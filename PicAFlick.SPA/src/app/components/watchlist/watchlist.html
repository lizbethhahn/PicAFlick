<div class="app-watchlist-container picaflick-shell">
  <div class="watchlist-sidebar">
    <h2>My Watchlist</h2>
  </div>

  <div class="watchlist-results">
    @if (watchlist)
    {
      @for (item of watchlist; track item.id) {
        <div class="media-card">
          <div class="poster">
            @if (item.posterPath) {
                <img src="https://image.tmdb.org/t/p/w185/{{ item.posterPath }}"/>           
              } @else {
                <img src="assets/images/movie-placeholder.jpg">
              }
          </div>
          <div class="media-info">
            <h3>{{ item.title }}</h3>
            <p><strong>Overview:</strong> {{ item.overview }}</p>
            <p>
              @if (item.mediaType === MediaType.Movie) {
                <strong>Release Date: {{ item.releaseDate }}</strong>
              } @else {
                <strong>First Air Date: {{ item.firstAirDate }}</strong>
              }
            </p>
            <div class="watchlist-actions">
              <button
                type="button"
                (click)="removeFromWatchlist(item.id)">
                Remove
              </button>
            </div>
          </div>
        </div>
      }
    }
  </div>
</div>
